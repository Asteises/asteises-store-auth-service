server:
  port: 7001
  forward-headers-strategy: framework

spring:
  application:
    name: auth-service
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev-local}

---
# DEV_LOCAL
api:
  version: v1

logging:
  file:
    name: logs/auth-service-dev-local.log

spring:
  config:
    activate:
      on-profile: dev-local

---
# DEV
api:
  version: v1

logging:
  level:
    org.springframework.security: debug
    org.springframework.jdbc.core: debug
    org.springframework.boot.autoconfigure: debug

spring:
  config:
    activate:
      on-profile: dev
  datasource:
    url: jdbc:postgresql://bootlegbricks-db:5432/${POSTGRES_DB}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC
      hibernate.format_sql: true
      hibernate:
        jdbc:
          lob:
            non_contextual_creation: true
    open-in-view: false
  jackson:
    serialization:
      write-dates-as-timestamps: false

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
---
# PROD

api:
  version: v1

spring:
  config:
    activate:
      on-profile: prod

