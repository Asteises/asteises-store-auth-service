spring:
  application:
    name: auth-service
  datasource:
    url: jdbc:postgresql://bootlegbricks-db:5432/${POSTGRES_DB}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC
      hibernate.format_sql: true
    open-in-view: false

server:
  port: 7001

logging:
  level:
    org.springframework.security: debug
    org.springframework.jdbc.core: debug
